version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=https://insurebot.shareindiainsurance.com
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Add environment variables here, or use env_file
      # - GOOGLE_API_KEY=your_key_here
      - ENVIRONMENT=production
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - ./backend/chat_logs_pdf:/app/chat_logs_pdf
